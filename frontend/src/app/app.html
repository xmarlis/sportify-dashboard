<div class="container-fluid py-4">
  <header class="mb-4">
    <div class="bg-primary text-white p-4 rounded shadow">
      <h1 class="display-4">{{ title }}</h1>
      <p class="lead mb-0">Track and analyze your running and cycling activities</p>
    </div>
  </header>

  <main>
    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
      <strong>Error:</strong> {{ errorMessage }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Strava Integration -->
    <app-strava-connect (activitiesImported)="onActivitiesImported()"></app-strava-connect>

    <!-- Activity Form -->
    <app-activity-form (createActivity)="onCreateActivity($event)"></app-activity-form>

    <!-- Loading Spinner -->
    <div *ngIf="isLoading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3">Loading activities...</p>
    </div>

    <!-- Activity Table -->
    <div *ngIf="!isLoading" class="card shadow">
      <div class="card-header bg-dark text-white">
        <h5 class="mb-0">Activity List ({{ activities.length }} total)</h5>
      </div>
      <div class="card-body p-0">
        <app-activity-table
          [activities]="activities"
          (deleteActivity)="onDeleteActivity($event)">
        </app-activity-table>
      </div>
    </div>
  </main>

  <footer class="mt-5 text-center text-muted">
    <hr>
    <p>&copy; 2025 Running Dashboard | Built with Angular and .NET 9</p>
  </footer>
</div>

<router-outlet />
