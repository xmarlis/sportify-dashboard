<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card text-center" style="max-width: 400px;">
    <div class="card-body p-5">
      <div *ngIf="isProcessing">
        <div class="spinner-border text-warning mb-4" style="width: 3rem; height: 3rem;" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <h5 class="card-title">Connecting to Strava</h5>
        <p class="card-text text-muted">Please wait while we complete the connection...</p>
      </div>

      <div *ngIf="!isProcessing && !error">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-check-circle text-success mb-3" viewBox="0 0 16 16">
          <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
          <path d="m10.97 4.97-.02.022-3.473 4.425-2.093-2.094a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05"/>
        </svg>
        <h5 class="card-title text-success">Connected!</h5>
        <p class="card-text text-muted">Redirecting to dashboard...</p>
      </div>

      <div *ngIf="error">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-x-circle text-danger mb-3" viewBox="0 0 16 16">
          <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
        </svg>
        <h5 class="card-title text-danger">Connection Failed</h5>
        <p class="card-text text-muted">{{ error }}</p>
        <small class="text-muted">Redirecting...</small>
      </div>
    </div>
  </div>
</div>
